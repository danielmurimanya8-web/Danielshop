
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration - Daniel Shop</title>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f4f9;
  color: #222;
}
header {
  background: #073b8c;
  color: white;
  padding: 22px;
  text-align: center;
}
header h1 {
  margin: 0;
}
.container {
  max-width: 950px;
  margin: 25px auto;
  padding: 15px;
}
.card {
  background: white;
  padding: 22px;
  margin-bottom: 20px;
  border-radius: 12px;
  box-shadow: 0 3px 12px #00000012;
}
h2 {
  color: #073b8c;
}
input, textarea, button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 7px;
  border: 1px solid #ccc;
  font-size: 15px;
}
button {
  background: #073b8c;
  color: white;
  border: none;
  font-weight: bold;
  cursor: pointer;
}
button:hover {
  opacity: .85;
}
.danger {
  background: #e53935;
}
.yellow {
  background: #ffcc00;
  color: #111;
}
.product {
  border: 1px solid #ddd;
  padding: 13px;
  margin: 12px 0;
  border-radius: 8px;
}
.product img {
  max-width: 110px;
  display: block;
  margin-bottom: 10px;
}
#dashboard {
  display: none;
}
#message {
  padding: 10px;
  font-weight: bold;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<header>
  <h1>DANIEL SHOP</h1>
  <p>Espace Administrateur</p>
</header>

<div class="container">

  <div class="card" id="login">
    <h2>Connexion administrateur</h2>

    <input type="email" id="email"
      placeholder="Adresse e-mail">

    <input type="password" id="password"
      placeholder="Mot de passe">

    <button id="loginBtn">Se connecter</button>
    <p id="message"></p>
  </div>

  <div id="dashboard">

    <div class="card">
      <h2>Tableau de bord</h2>
      <p>Bienvenue dans l'administration de Daniel Shop.</p>
      <button class="danger" id="logoutBtn">
        Déconnexion
      </button>
    </div>

    <div class="card">
      <h2>Ajouter un produit</h2>

      <input id="name" placeholder="Nom du produit">

      <textarea id="description"
        placeholder="Description du produit"></textarea>

      <input id="price" type="number"
        placeholder="Prix en dollars">

      <input id="category"
        placeholder="Catégorie : Samsung, iPhone, etc.">

      <input id="image"
        placeholder="Lien de la photo du produit">

      <button id="addBtn">Ajouter le produit</button>
      <p id="productMessage"></p>
    </div>

    <div class="card">
      <h2>Mes produits</h2>
      <button class="yellow" id="refreshBtn">
        Actualiser les produits
      </button>
      <div id="products"></div>
    </div>

  </div>
</div>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL =
'https://ozgobmiaxrcxhlafrici.supabase.co';

const SUPABASE_KEY =
'sb_publishable_x7NK-6o_ixlkMO7QOeHN9w_gxHpsMpx';

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

function message(id, text) {
  $(id).textContent = text;
}

async function checkAdmin() {
  const { data: { user } } =
    await supabase.auth.getUser();

  if (!user) {
    $('login').style.display = 'block';
    $('dashboard').style.display = 'none';
    return;
  }

  const { data, error } = await supabase
    .from('admin_users')
    .select('*')
    .eq('user_id', user.id)
    .maybeSingle();

  if (error || !data) {
    message('message',
      'Accès refusé : compte administrateur non autorisé.');
    await supabase.auth.signOut();
    return;
  }

  $('login').style.display = 'none';
  $('dashboard').style.display = 'block';
  loadProducts();
}

$('loginBtn').onclick = async () => {
  message('message', 'Connexion en cours...');

  const { error } = await supabase.auth
    .signInWithPassword({
      email: $('email').value.trim(),
      password: $('password').value
    });

  if (error) {
    message('message', error.message);
    return;
  }

  await checkAdmin();
};

$('logoutBtn').onclick = async () => {
  await supabase.auth.signOut();
  location.reload();
};

$('addBtn').onclick = async () => {
  const product = {
    name: $('name').value.trim(),
    description: $('description').value.trim(),
    price: Number($('price').value),
    category: $('category').value.trim(),
    image_url: $('image').value.trim(),
    is_active: true
  };

  if (!product.name || !product.price) {
    message('productMessage',
      'Remplis le nom et le prix du produit.');
    return;
  }

  const { error } = await supabase
    .from('products')
    .insert(product);

  if (error) {
    message('productMessage', error.message);
    return;
  }

  message('productMessage', 'Produit ajouté avec succès !');

  $('name').value = '';
  $('description').value = '';
  $('price').value = '';
  $('category').value = '';
  $('image').value = '';

  loadProducts();
};

async function loadProducts() {
  const area = $('products');
  area.textContent = 'Chargement...';

  const { data, error } = await supabase
    .from('products')
    .select('*')
    .order('id', { ascending: false });

  if (error) {
    area.textContent = error.message;
    return;
  }

  area.replaceChildren();

  if (!data || data.length === 0) {
    area.textContent = 'Aucun produit enregistré.';
    return;
  }

  data.forEach(p => {
    const box = document.createElement('div');
    box.className = 'product';

    const title = document.createElement('h3');
    title.textContent = p.name || 'Produit';

    const price = document.createElement('p');
    price.textContent = 'Prix : ' + p.price + ' $';

    const category = document.createElement('p');
    category.textContent = 'Catégorie : ' + (p.category || '');

    box.append(title, price, category);

    if (p.image_url) {
      const img = document.createElement('img');
      img.src = p.image_url;
      img.alt = p.name || 'Produit';
      box.append(img);
    }

    const edit = document.createElement('button');
    edit.className = 'yellow';
    edit.textContent = 'Modifier';

    edit.onclick = async () => {
      const newName = prompt('Nouveau nom :', p.name || '');
      if (newName === null) return;

      const newPrice = prompt('Nouveau prix en dollars :', p.price);
      if (newPrice === null) return;

      const { error } = await supabase
        .from('products')
        .update({
          name: newName.trim(),
          price: Number(newPrice)
        })
        .eq('id', p.id);

      if (error) {
        alert(error.message);
      } else {
        alert('Produit modifié !');
        loadProducts();
      }
    };

    const del = document.createElement('button');
    del.className = 'danger';
    del.textContent = 'Supprimer';

    del.onclick = async () => {
      if (!confirm('Supprimer ce produit ?')) return;

      const { error } = await supabase
        .from('products')
        .delete()
        .eq('id', p.id);

      if (error) {
        alert(error.message);
      } else {
        alert('Produit supprimé !');
        loadProducts();
      }
    };

    box.append(edit, del);
    area.append(box);
  });
}

$('refreshBtn').onclick = loadProducts;

const { data: { session } } =
  await supabase.auth.getSession();

if (session) {
  await checkAdmin();
}
</script>

</body>
</html>
